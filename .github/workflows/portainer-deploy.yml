name: Deploy Portainer stack

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - ".dockerignore"
      - "Dockerfile"
      - "bun.lock"
      - "compose.portainer.yml"
      - "package.json"
      - "turbo.json"
      - "deploy/nginx.conf"
      - ".github/workflows/portainer-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy in Portainer
    runs-on: ubuntu-latest

    steps:
      - name: Redeploy Portainer Community Edition stack
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_ACCESS_TOKEN: ${{ secrets.PORTAINER_ACCESS_TOKEN }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          for name in \
            PORTAINER_URL \
            PORTAINER_ACCESS_TOKEN \
            PORTAINER_STACK_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::Add ${name} to the repository Actions secrets."
              exit 1
            fi
          done

          PORTAINER_URL="${PORTAINER_URL%/}"
          curl \
            --fail-with-body \
            --request PUT \
            --retry 3 \
            --retry-all-errors \
            --show-error \
            --silent \
            --header "Content-Type: application/json" \
            --header "X-API-Key: ${PORTAINER_ACCESS_TOKEN}" \
            --data '{"Prune":false}' \
            "${PORTAINER_URL}/api/stacks/${PORTAINER_STACK_ID}/git/redeploy"
