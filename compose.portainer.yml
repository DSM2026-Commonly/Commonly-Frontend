services:
  admin-web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-dsm2026-commonly}/commonly-admin-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_PORT:-8081}:80"
    networks:
      - commonly-web

  civil-web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-dsm2026-commonly}/commonly-civil-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "${CIVIL_WEB_PORT:-8082}:80"
    networks:
      - commonly-web

  user-web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-dsm2026-commonly}/commonly-user-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "${USER_WEB_PORT:-8083}:80"
    networks:
      - commonly-web

networks:
  commonly-web:
